# CI/CD: test → build → deploy (chỉ khi mọi thứ xanh, chỉ từ nhánh main)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp thì huỷ lần chạy cũ, không deploy chồng lên nhau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy sống) và test_bonus_cicd (tự kiểm tra
      # badge của chính workflow này). Test build Docker để job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }}

      # Build được chưa đủ — container phải khởi động và trả lời /health
      - name: Container smoke test
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-agent-nbcr.onrender.com' }}
    steps:
      # Deploy Hook là một URL bí mật: ai có nó là deploy được → để trong Secrets
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Chưa có secret RENDER_DEPLOY_HOOK_URL — bỏ qua bước deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Đã gửi yêu cầu deploy commit ${{ github.sha }}"

      # Render build + chuyển traffic mất vài phút; free tier có thể đang ngủ
      - name: Smoke test
        run: |
          sleep 45
          for i in $(seq 1 20); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
